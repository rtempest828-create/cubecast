<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Ausgabe für OBS und das Ausgabefenster: lädt nur eigene Dateien und den lokalen Ausgabe-Server. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:* ws://localhost:*"
    />
    <title>Minecraft VTuber – Ausgabe</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: fixed;
        left: 8px;
        top: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font: 13px system-ui, sans-serif;
      }
      #status[hidden] {
        display: none;
      }
      body.window {
        -webkit-app-region: drag;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="status">Warte auf Minecraft VTuber …</div>
    <script type="module" src="./src/viewer/viewer.ts"></script>
